name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../seg-${{ matrix.target }}.tar.gz seg
          cd -

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/seg.exe" -DestinationPath "seg-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.target }}
          path: seg-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums and release body
        run: |
          cd artifacts
          sha256sum seg-* > sha256sums.txt
          cat sha256sums.txt

          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${GITHUB_REPOSITORY}"

          {
            echo "## Downloads"
            echo ""
            echo "| Platform | Architecture | Download |"
            echo "|----------|-------------|----------|"
            for file in seg-*.tar.gz seg-*.zip; do
              [ -f "$file" ] || continue
              name="${file#seg-}"
              case "$name" in
                x86_64-unknown-linux-gnu*)    platform="Linux";   arch="x86_64 (glibc)" ;;
                x86_64-unknown-linux-musl*)   platform="Linux";   arch="x86_64 (musl)" ;;
                aarch64-unknown-linux-gnu*)   platform="Linux";   arch="aarch64 (glibc)" ;;
                aarch64-unknown-linux-musl*)  platform="Linux";   arch="aarch64 (musl)" ;;
                armv7-unknown-linux-gnueabi*) platform="Linux";   arch="armv7" ;;
                x86_64-apple-darwin*)         platform="macOS";   arch="x86_64 (Intel)" ;;
                aarch64-apple-darwin*)        platform="macOS";   arch="aarch64 (Apple Silicon)" ;;
                x86_64-pc-windows-msvc*)      platform="Windows"; arch="x86_64" ;;
                aarch64-pc-windows-msvc*)     platform="Windows"; arch="aarch64" ;;
                *) platform="Other"; arch="$name" ;;
              esac
              sha=$(grep "$file" sha256sums.txt | cut -d' ' -f1)
              echo "| $platform | $arch | [\`$file\`](https://github.com/$REPO/releases/download/$TAG/$file) <br/> \`sha256:${sha}\` |"
            done
            echo ""
            echo "---"
            echo ""
          } > ../release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release_body.md
          files: |
            artifacts/seg-*.tar.gz
            artifacts/seg-*.zip
            artifacts/sha256sums.txt
